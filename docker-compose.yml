services:
  taskmate_postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "2103:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - Mynetwork
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
      - "3000:3000"   
    depends_on:
      - taskmate_postgres
    networks:
      - Mynetwork

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    networks:
      - Mynetwork

networks:
  Mynetwork:
    driver: bridge
      
volumes:
  pg_data:
