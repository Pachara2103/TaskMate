<div class="signin-container"
    [ngStyle]="{'width':signup? '32vw':'', 'height':signup? '90vh':'75vh', 'top':signup? '6vh':''}">
    <div style="position: relative;align-items: center;flex-direction: column;display: flex;">
        <div style="flex-direction: column; display: flex; text-align: center; width: 100%; margin-bottom: 15px;" [ngStyle]="{'margin-bottom':signup?'':'40px'}">
            <label style="font-size: 40px; font-weight: bold;">{{signup? 'Sign up':'Login'}}</label>
            <label style="font-size: 16px; color: #a1a1a1;">Please enter your detail</label>
        </div>

        <section id="signin">

            <div style=" flex-direction: column; display: flex; width: 100%;" *ngIf="!signup">

                <div class="input-box">
                    <label> Email</label>
                    <input type="text" [(ngModel)]="email">
                </div>

                <div class="input-box">
                    <label> Password</label>
                    <input type="password" [(ngModel)]="password" (keyup.enter)="sendLogin(email, password)">
                </div>

                <button class="button" (click)="sendLogin(email, password)">Sign in</button>

                <div style="flex-direction: row; display: flex; justify-content: center; margin: 10px;">
                    <label style="color: #a1a1a1;">Don't have a account ? </label>
                    <label (click)="changeSign()"
                        style="text-decoration:underline; margin-left: 10px; color: #036cff; cursor: pointer;">
                        Signup
                    </label>
                </div>
            </div>

        </section>

        <section id="signup">

            <div style=" flex-direction: column; display: flex; width: 17vw;" *ngIf="signup">

                <div class="input-box">
                    <label> Username</label>
                    <input type="text" [(ngModel)]="username">
                </div>

                <div class="input-box">
                    <label> Email</label>
                    <input type="text" placeholder="example@gmail.com" [(ngModel)]="email">
                </div>

                <div class="input-box">
                    <label> Password</label>
                    <input type="password" [(ngModel)]="password">
                </div>

                <div class="input-box">
                    <label> Confirm Password</label>
                    <input type="password" [(ngModel)]="confrimpassword">
                </div>

                <div
                    style="flex-direction: row; display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px;">
                    <input type="file" id="fileInput" accept="image/*" (change)="onFileSelected($event)"
                        style="display: none;" />

                    <label for="fileInput"
                        [ngStyle]="{'background-image': imagePreview ? 'url(' + imagePreview + ')' : '','background-size': 'cover','background-position': 'center'}"
                        style="width: 70px; height: 70px; background-color: #d6d6d6; border-radius: 50%; cursor: pointer; display: flex; overflow: hidden; justify-content: center; align-items: center;">
                        <img *ngIf="!imagePreview" src="images/icons/default.png" style="width: 70%; height: 70%;">
                    </label>

                    <div>Click to change profile</div>
                </div>


                <button class="button" (click)="sendSignup(username, email, password, confrimpassword)">Sign up</button>

                <div style="flex-direction: row; display: flex; justify-content: center; margin: 10px;">
                    <label style="color: #a1a1a1;">Already have a account ? </label>
                    <label (click)="changeSign()"
                        style="text-decoration:underline; margin-left: 10px; color: #036cff; cursor: pointer;">
                        Sign in </label>
                </div>
            </div>

        </section>

    </div>

</div>




<img src="images/login.png" style="width: 100vw; height: 100vh;">
<style>
    .signin-container {
        position: absolute;
        left: 8vw;
        top: 8vh;
        border-radius: 100px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        background-color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;

        width: 32vw;
        height: 80vh;
    }




    .input-box {
        flex-direction: column;
        display: flex;
        margin-bottom: 20px;
    }

    .input-box input {
        width: 98%;
        height: 35px;
        border-radius: 5px;
        border: solid 1px #d1d1d1
    }

    .input-box label {
        margin-bottom: 5px;
        font-size: 16px;
    }


    .button {
        width: 100%;
        height: 35px;
        border-radius: 5px;
        border: none;
        background-color: #4a81e0;
        color: #fff;
        margin-bottom: 20px;
        cursor: pointer;

        &:hover {
            background-color: #2469e0;
        }
    }

    .google {
        width: 100%;
        height: 35px;
        border-radius: 5px;
        background-color: #fff;
        border: solid 1px #d1d1d1;
        cursor: pointer;

        &:hover {
            background-color: #d6d6d6;
        }
    }
</style>
