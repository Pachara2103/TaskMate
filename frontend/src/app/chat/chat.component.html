<aside class="right-side" #chat>

    <section id="bar">
        <div class="chat-bar">

            <div (click)="toggleexpand()" style=" margin-bottom: 20px; cursor: pointer;">
                <div style="height: 40px;">
                    <svg viewBox="-1 0 24 24" width="100%" height="100%" style="fill: white;">
                        <path [attr.d]="getarrow()"></path>
                    </svg>
                </div>

            </div>

            <div *ngFor="let tab of tabTask; let i = index;" (click)="changeTab(tab)"
                style=" width: 100%; height: 50px; cursor: pointer; justify-content: center; align-items: center; display: flex;">
                <svg viewBox="0 0 24 24" width="70%" height="70%"
                    [ngStyle]="{ 'fill': tabFocus === tab ? '#fff' : '#839ca0'}">
                    <path [attr.d]="getimg(tab)"></path>
                </svg>

            </div>
        </div>

    </section>

    <main id="content" style="flex-direction: column; display: flex ; width: 100%;">

        <section id="icon= chatroom" *ngIf="this.tabFocus==='chatroom' ">

            <div style="flex-direction: column; display: flex;">
                <div
                    style="justify-content: center; align-items: center; display: flex; font-size: 20px; font-weight: bold; padding: 10px;">
                    Chat
                </div>

                <div style="flex-direction: row; display: flex; gap: 5px; cursor: pointer;">
                    <div *ngFor="let i of chatlist"
                        [ngStyle]="{'color': '#333', 'border-bottom':chatfocus===i? 'solid 2px #ed694c': '','padding':'5px', 'background': chatfocus===i? '#ededed':''}"
                        (click)="chchatfocus(i)">
                        {{i}}
                    </div>
                </div>

                <section id="icon= all friend room">
                    <div style="flex-direction: column; display: flex; width: 100%; height: 100%; margin-top: 20px; ">

                        <div *ngIf="chatfocus!='Room'">
                            <div *ngFor="let friend of allfriends; let i = index;"
                                (click)="changeChat(friend, 'friend')"
                                [ngStyle]="{'background-color': chatFocus[0]==='friend' && chatFocus[1] === friend.friend_id ? '#e5e5e5':'#fff'}"
                                style="width: 100%; height: 50px; flex-direction: row; display: flex; align-items: center; display: flex; position: relative; gap: 15px; cursor: pointer; padding-left: 10px;">

                                <div
                                    style=" background-color: #f2f2f2; width: 45px; height: 45px; border-radius: 50%; justify-content: center; align-items: center; display: flex;">
                                    <img [src]="'http://localhost:4000/uploads/' + friend.profile + '.png'"
                                        style="width: 70%; height: 70%;">
                                </div>

                                <div> {{ friend.friend_name }} </div>

                                <div style=" width: 45px; height: 45px; position: absolute; right: 20px;">
                                    <img src="images/icons/message.png" style="width: 100%; height: 100%;">
                                </div>
                            </div>

                        </div>

                        <div *ngIf="chatfocus!='Friend'">
                            <div *ngFor="let room of  allrooms;" (click)="changeChat(room, 'room')"
                                [ngStyle]="{'background-color': chatFocus[0]==='room' && chatFocus[1] === room.roomid ? '#e5e5e5':'#fff'}"
                                style=" width: 100%; height: 50px; flex-direction: row; display: flex; align-items: center; display: flex; position: relative; gap: 15px; cursor: pointer; padding-left: 10px;">
                                <div
                                    style=" background-color: #f2f2f2; width: 45px; height: 45px; border-radius: 50%; align-items: center; justify-content: center; display: flex;">
                                    <img [src]="'http://localhost:4000/uploads/' + room.profile + '.png'"
                                        style="width: 70%; height: 70%;">
                                </div>

                                <div> {{ room.roomname}} </div>

                                <div
                                    style="background-color: #edbb5e; position: absolute; top:0; left: 60px; font-size: 14px; border-bottom-right-radius: 5px;  border-bottom-left-radius: 5px;">
                                    room</div>

                                <div style=" width: 45px; height: 45px; position: absolute; right: 20px;">
                                    <img src="images/icons/message.png" style="width: 100%; height: 100%;">
                                </div>
                            </div>


                        </div>


                    </div>


                </section>

            </div>




        </section>

        <section id="icon= request" *ngIf="this.tabFocus==='request'">

            <div style="flex-direction: column; display: flex;">

                <div
                    style="justify-content: center; align-items: center; display: flex; font-size: 20px; font-weight: bold; padding: 10px;">
                    Request
                </div>

                <div
                    style="flex-direction: column; display: flex; width: 100%; height: 100%; margin-top: 20px; position: relative;" >
                    <div *ngIf="isEmpty(allrequest)" style="display: flex; justify-content: center; align-items: center;"> No request</div>
                    <div *ngFor="let req of allrequest; let i = index ;"
                        style="background-color: #fff; width: 100%; height: 50px; flex-direction: row; display: flex; align-items: center; display: flex; position: relative; gap: 15px;">
                        <div style=" background-color: #27ca66; width: 45px; height: 45px; border-radius: 50%">

                        </div>



                        <div> {{ req.to_username }} </div>

                        <div style="position: absolute; right: 20px; flex-direction: row; display: flex; gap: 5px;">
                            <button (click)="responseRequest(req, 'accept')">accept</button>
                            <button (click)="responseRequest(req, 'cancel')">cancel</button>

                        </div>
                    </div>
                </div>
            </div>


        </section>

        <section if="icon= searchfriend" *ngIf="this.tabFocus==='searchfriend'">
            <div style="flex-direction: column; display: flex;">

                <div
                    style="justify-content: center; align-items: center; display: flex; font-size: 20px; font-weight: bold; padding: 10px;">
                    Find User
                </div>

                <div style="flex-direction: row; display: flex;">

                    <div
                        style="width: 50px; height: 40px; background-color: #f1f1f1; justify-content: center; align-items: center; display: flex;">
                        <img src="images/icons/search.png" style="width: 80%; height: 80%;">
                    </div>

                    <input type="text" placeholder="search" style="width: 100%; border: none; padding-left: 5px;"
                        [(ngModel)]="searchusername" (keyup.enter)="getUser()">

                </div>


                <div style="flex-direction: column; display: flex; width: 100%; height: 100%; margin-top: 20px;">
                    <div *ngFor="let friend of alluser; let i = index ;"
                        style="background-color: #fff; width: 100%; height: 50px; flex-direction: row; display: flex; align-items: center; display: flex; position: relative; gap: 15px;">

                        <div
                            style=" background-color: #f2f2f2; width: 45px; height: 45px; border-radius: 50%; justify-content: center; align-items: center; display: flex;">
                            <img [src]="'http://localhost:4000/uploads/' + friend.profile + '.png'"
                                style="width: 70%; height: 70%;">
                        </div>

                        <div> {{ friend.username }} </div>


                        <button *ngIf="friend.status!='friend'" (click)="sendfriendrequest(friend)"
                            style="position: absolute; right: 20px; cursor: pointer;">{{
                            friend.status ==='pending'? 'requested':'follow'}}</button>

                        <button *ngIf="friend.status==='friend'" 
                            style="position: absolute; right: 20px; border-radius: 5px; background-color: #70b8ff; border: none; padding: 5px;">friend</button>


                    </div>
                </div>


            </div>


        </section>

    </main>


</aside>

<style>
    .right-side {
        /* width: 4vw; */
        width: 4vw;
        height: 96vh;
        margin-top: 1rem;
        margin-right: 1rem;
        margin-bottom: 1rem;
        position: relative;
        flex-direction: row;
        display: flex;
        transition: width 0.3s ease;
        overflow: hidden;
    }

    .right-side.expand {
        width: 25vw;
        /* background-color: #eff5f5; */
        background-color: #d1f0f0;
        border-top-right-radius: 10px;
        border-bottom-right-radius: 10px;

    }

    .chat-bar {
        /* position: absolute;
        top: 0; */
        flex-direction: column;
        display: flex;
        background-color: #497173;
        width: 4vw;
        height: 100%;

        padding: 5px;
        box-sizing: border-box;
        gap: 2px;
        border-radius: 10px;

    }


    .chat-container {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 50%;
        background-color: rgb(146, 255, 170);

        & .mid {
            flex-direction: column;
            display: flex;
            justify-content: flex-start;
            background-color: #91fdff;
            width: 100%;
            height: 72%;
            overflow-y: auto;

            & .chat-right {
                position: relative;
                background-color: #a0e7e5;
                margin: 5px;
                padding: 10px;
                max-width: 60%;
                margin-left: auto;

                border-radius: 20px 0px 20px 20px;
                box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.2);
                word-wrap: break-word;
                word-break: break-word;
                text-align: left;

            }
        }

        & .chat-left {
            position: relative;
            background-color: #eee;
            margin: 5px;
            padding: 10px;
            max-width: 80%;
            margin-right: auto;

            border-radius: 0px 20px 20px 20px;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.2);
            word-wrap: break-word;
            word-break: break-word;
            text-align: right;
            flex-direction: row;
            display: flex;
        }



        & .top {
            width: 100%;
            height: 14%;
            background-color: #f8a8ff;
            justify-content: center;
            align-items: center;
            display: flex;
        }


        & .bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 14%;
        }

        & .bottom input {
            width: 100%;
            height: 100%;
        }
    }
</style>
